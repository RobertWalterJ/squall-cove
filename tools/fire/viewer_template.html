<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squall Cove Fire Viewer</title>
<style>
  :root { color-scheme: dark; --bg:#14161a; --panel:#1e2127; --line:#3a3f48; --ink:#f0f2f5; --mut:#b5bcc8; --acc:#ff9a3c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.45 system-ui, Segoe UI, Arial, sans-serif; }
  header { padding:14px 16px 6px; }
  h1 { margin:0 0 4px; font-size:24px; }
  p.note { margin:0; color:var(--mut); font-size:16px; }
  .wrap { display:flex; flex-wrap:wrap; gap:16px; padding:12px 16px 24px; }
  .controls { flex:1 1 320px; max-width:460px; display:grid; gap:12px; align-content:start; }
  fieldset { border:1px solid var(--line); border-radius:8px; background:var(--panel); margin:0; padding:8px 12px 10px; }
  legend { padding:0 6px; font-size:16px; color:var(--mut); }
  label { display:inline-flex; align-items:center; gap:8px; margin:3px 14px 3px 0; font-size:18px; min-height:32px; cursor:pointer; }
  input[type=radio], input[type=checkbox] { width:20px; height:20px; accent-color:var(--acc); }
  input[type=range] { width:100%; height:32px; accent-color:var(--acc); }
  .row { display:flex; justify-content:space-between; font-size:16px; color:var(--mut); }
  button { font:inherit; font-size:18px; color:var(--ink); background:#2b3039; border:1px solid var(--line); border-radius:8px; padding:8px 16px; cursor:pointer; min-height:44px; }
  button:hover { background:#353b46; }
  :focus-visible { outline:3px solid #6fb7ff; outline-offset:2px; }
  .stage { flex:3 1 560px; min-width:300px; }
  canvas { width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:8px; background:#000; }
  #info { margin-top:8px; font-size:16px; color:var(--mut); }
  #err { color:#ffb3a8; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>Squall Cove Fire Viewer</h1>
  <p class="note">Plays the baked fire flipbooks from <code>assets/fire</code>. Everything is built into this page; it works by double-click.</p>
</header>
<div class="wrap">
  <div class="controls">
    <fieldset id="fsPreset"><legend>Fire</legend></fieldset>
    <fieldset id="fsView"><legend>Layers</legend>
      <label><input type="radio" name="view" value="comb" checked> Flame and smoke</label>
      <label><input type="radio" name="view" value="flame"> Flame only</label>
      <label><input type="radio" name="view" value="smoke"> Smoke only</label>
      <label><input type="radio" name="view" value="heat"> Heat map</label>
    </fieldset>
    <fieldset id="fsLook"><legend>Sensor look</legend>
      <label><input type="radio" name="look" value="normal" checked> Normal eye</label>
      <label><input type="radio" name="look" value="thermal"> Thermal (white-hot)</label>
      <label><input type="radio" name="look" value="nv"> Night vision (green)</label>
    </fieldset>
    <fieldset id="fsBg"><legend>Background</legend>
      <label><input type="radio" name="bg" value="night" checked> Night</label>
      <label><input type="radio" name="bg" value="day"> Daylight grey</label>
      <label><input type="radio" name="bg" value="dusk"> Dusk</label>
    </fieldset>
    <fieldset><legend>Size and speed</legend>
      <div class="row"><label for="size">Size</label><span id="sizeV"></span></div>
      <input id="size" type="range" min="0.4" max="3" step="0.05" value="1">
      <div class="row"><label for="speed">Playback speed</label><span id="speedV"></span></div>
      <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1">
      <label><input id="glow" type="checkbox" checked> Light glow (uses the baked light colour and flicker)</label>
      <div><button id="pause" type="button">Pause</button></div>
    </fieldset>
    <div id="err" role="status"></div>
  </div>
  <div class="stage">
    <canvas id="cv" width="960" height="640" role="img" aria-label="Fire preview"></canvas>
    <div id="info" aria-live="polite"></div>
  </div>
</div>
<script>
let ATLAS = /*ATLAS_JSON*/null;
const DATA = /*ATLAS_DATA*/{};   // data URIs for the atlas PNGs (file:// pages cannot read pixels from files)
const NAMES = ['campfire','gas','pool','vehicle','building'];
const LABEL = {campfire:'Campfire or barrel', gas:'Gas flame', pool:'Fuel pool or oil fire', vehicle:'Vehicle fire', building:'Building or roof fire'};
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const state = { preset:null, size:1, speed:1, paused:false, t:0, last:0 };
const cache = {};   // per preset: {flame:{light,dark}, smoke:img, heat:{raw,thermal}, info}
let presets = [];

function load(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('could not load ' + src.slice(0, 60))); i.src = src; }); }
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function whiteHot(v) {            // 0..1 -> rgb
  const s = [[0,[4,4,14]],[0.18,[40,10,90]],[0.38,[150,20,70]],[0.58,[235,70,20]],[0.78,[255,190,40]],[0.92,[255,245,170]],[1,[255,255,255]]];
  for (let i = 1; i < s.length; i++) if (v <= s[i][0]) { const a = s[i-1], b = s[i], f = (v - a[0]) / (b[0] - a[0]); return a[1].map((x, k) => x + (b[1][k] - x) * f); }
  return [255,255,255];
}
async function prep(name) {
  if (cache[name]) return cache[name];
  const info = ATLAS.presets[name], d = DATA[name] || {};
  const url = k => d[k] || ('../assets/fire/' + info[k].file);
  const [fi, si, hi] = await Promise.all([load(url('flame')), load(url('smoke')), load(url('heat'))]);
  const out = { info };
  // flame: stored premultiplied. Draw as: dark = black*alpha (source-over), then light = rgb (lighter).
  const fl = canvasOf(fi.width, fi.height), fd = canvasOf(fi.width, fi.height);
  const c1 = fl.getContext('2d'), c2 = fd.getContext('2d');
  c1.drawImage(fi, 0, 0);
  let id; try { id = c1.getImageData(0, 0, fl.width, fl.height); } catch (e) { id = null; }
  if (id) {
    const p = id.data;
    // getImageData returns the file's own values (the premultiplied rgb and its alpha), so use them directly
    const q = p;
    const lightD = new ImageData(new Uint8ClampedArray(p.length), fl.width, fl.height);
    const darkD = new ImageData(new Uint8ClampedArray(p.length), fl.width, fl.height);
    for (let i = 0; i < q.length; i += 4) {
      lightD.data[i] = q[i]; lightD.data[i+1] = q[i+1]; lightD.data[i+2] = q[i+2]; lightD.data[i+3] = 255;
      darkD.data[i+3] = q[i+3];
    }
    c1.putImageData(lightD, 0, 0); c2.putImageData(darkD, 0, 0);
    out.flame = { light: fl, dark: fd };
  } else { out.flame = { light: fi, dark: null }; }   // falls back to plain additive
  out.smoke = si;
  // heat: grey 0..255 -> thermal palette canvas
  const hc = canvasOf(hi.width, hi.height), th = canvasOf(hi.width, hi.height);
  hc.getContext('2d').drawImage(hi, 0, 0);
  try {
    const hd = hc.getContext('2d').getImageData(0, 0, hc.width, hc.height), tc = th.getContext('2d').createImageData(hc.width, hc.height);
    const lut = []; for (let i = 0; i < 256; i++) lut.push(whiteHot(Math.pow(i / 255, 1.25)));
    for (let i = 0; i < hd.data.length; i += 4) { const v = hd.data[i], c = lut[v]; tc.data[i] = c[0]; tc.data[i+1] = c[1]; tc.data[i+2] = c[2]; tc.data[i+3] = v < 6 ? 0 : Math.min(255, v * 3); }
    th.getContext('2d').putImageData(tc, 0, 0);
    out.heat = th;
  } catch (e) { out.heat = hi; $('err').textContent = 'Heat colouring needs the built-in images; showing plain grey.'; }
  cache[name] = out; return out;
}

function sel(name) { const el = document.querySelector('input[name=' + name + ']:checked'); return el ? el.value : null; }
function drawFrame(img, info, f, x, y, mpp_px, alphaMul) {   // bottom-centre anchored; mpp_px = canvas px per metre
  const cols = ATLAS.presets[state.preset].grid[0], fw = info.frame_px[0], fh = info.frame_px[1];
  const r = Math.floor(f / cols), c = f % cols;
  const w = fw * info.m_per_px * mpp_px, h = fh * info.m_per_px * mpp_px;
  ctx.drawImage(img, c * fw, r * fh, fw, fh, x - w / 2, y - h, w, h);
}
function background(kind, look) {
  const W = cv.width, H = cv.height, gy = H - 70;
  let g;
  if (look === 'thermal') { g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#05050f'); g.addColorStop(1, '#14142a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); return gy; }
  if (kind === 'night') { g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#04060c'); g.addColorStop(1, '#10151f'); }
  else if (kind === 'day') { g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#9aa7b4'); g.addColorStop(1, '#b8bfc5'); }
  else { g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1b2346'); g.addColorStop(0.55, '#8a4a63'); g.addColorStop(1, '#f0955a'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = kind === 'day' ? '#6f7a62' : kind === 'dusk' ? '#2a2230' : '#0a0d10'; ctx.fillRect(0, gy, W, H - gy);
  return gy;
}
function render() {
  if (!state.preset || !cache[state.preset]) return;
  const P = cache[state.preset], info = P.info, N = info.frames;
  const view = sel('view'), look = sel('look'), bg = sel('bg');
  const f = Math.floor(state.t * info.fps) % N;
  const gy = background(bg, look);
  const mpp = (cv.height * 0.62 / Math.max(info.smoke.size_m[1], 1)) * state.size;   // canvas px per metre
  const x = cv.width / 2;
  ctx.save();
  // glow
  const L = info.light;
  if ($('glow').checked && look !== 'thermal' && view !== 'smoke' && view !== 'heat') {
    const fl = L.flicker[f % L.flicker.length], rad = Math.max(60, info.flame.size_m[1] * mpp * 2.2 * (0.9 + 0.1 * fl));
    const c = L.color.map(v => Math.round(v * 255)), a = Math.min(0.8, 0.28 * fl * Math.min(2, Math.sqrt(L.intensity_vs_campfire || 1)));
    const gx = x, gyy = gy - info.flame.size_m[1] * mpp * 0.3;
    const rg = ctx.createRadialGradient(gx, gyy, 4, gx, gyy, rad);
    rg.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${a})`); rg.addColorStop(0.5, `rgba(${c[0]},${Math.round(c[1]*0.7)},${Math.round(c[2]*0.5)},${a*0.35})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = rg; ctx.fillRect(0, 0, cv.width, cv.height); ctx.globalCompositeOperation = 'source-over';
  }
  // draw into target (nv uses an offscreen copy of the same layers)
  if (look === 'thermal') {
    ctx.globalCompositeOperation = 'source-over';
    drawFrame(P.heat, info.heat, f, x, gy, mpp);
  } else {
    if (view === 'smoke' || view === 'comb') drawFrame(P.smoke, info.smoke, f, x, gy, mpp);
    if (view === 'flame' || view === 'comb') {
      if (P.flame.dark) { drawFrame(P.flame.dark, info.flame, f, x, gy, mpp); ctx.globalCompositeOperation = 'lighter'; drawFrame(P.flame.light, info.flame, f, x, gy, mpp); }
      else { ctx.globalCompositeOperation = 'lighter'; drawFrame(P.flame.light, info.flame, f, x, gy, mpp); }
      ctx.globalCompositeOperation = 'source-over';
    }
    if (view === 'heat') {
      ctx.globalCompositeOperation = 'source-over';
      drawFrame(P.heat, info.heat, f, x, gy, mpp);
    }
  }
  ctx.restore();
  if (look === 'nv') {                    // night vision: grey-scale gain, then green phosphor tint, plus a little grain
    const img = canvasOf(cv.width, cv.height); img.getContext('2d').drawImage(cv, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    try { ctx.filter = 'grayscale(1) brightness(1.9) contrast(1.25)'; } catch (e) {}
    ctx.drawImage(img, 0, 0); ctx.filter = 'none';
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#4dff6e'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,40,0,0.18)'; for (let yy = 0; yy < cv.height; yy += 4) ctx.fillRect(0, yy, cv.width, 1);
  }
  $('info').textContent = `${LABEL[state.preset]}: frame ${f + 1} of ${N}, baked at ${info.fps} frames per second. Flame sprite ${info.flame.size_m[0].toFixed(1)} by ${info.flame.size_m[1].toFixed(1)} metres, smoke sprite ${info.smoke.size_m[0].toFixed(1)} by ${info.smoke.size_m[1].toFixed(1)} metres.`;
}
function tick(now) {
  const dt = Math.min(0.1, (now - state.last) / 1000); state.last = now;
  if (!state.paused) state.t += dt * state.speed;
  render(); requestAnimationFrame(tick);
}
function buildUI() {
  presets = NAMES.filter(n => ATLAS.presets[n]);
  const fs = $('fsPreset');
  presets.forEach((n, i) => {
    const l = document.createElement('label'); l.innerHTML = '<input type="radio" name="preset" value="' + n + '"' + (i === 0 ? ' checked' : '') + '> ' + LABEL[n]; fs.appendChild(l);
  });
  fs.addEventListener('change', async e => { if (e.target.name === 'preset') { await prep(e.target.value); state.preset = e.target.value; state.t = 0; } });
  const sync = () => { state.size = +$('size').value; state.speed = +$('speed').value; $('sizeV').textContent = state.size.toFixed(2) + 'x'; $('speedV').textContent = state.speed.toFixed(2) + 'x'; };
  $('size').oninput = sync; $('speed').oninput = sync; sync();
  $('pause').onclick = () => { state.paused = !state.paused; $('pause').textContent = state.paused ? 'Play' : 'Pause'; };
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { state.paused = true; $('pause').textContent = 'Play'; }
}
async function start() {
  let atlas = ATLAS;
  if (!atlas) { try { atlas = await (await fetch('../assets/fire/fire_atlas.json')).json(); } catch (e) { $('err').textContent = 'The atlas list is missing: run tools/fire/build_viewer.py to rebuild this page.'; return; } }
  ATLAS = atlas; buildUI();
  try { await prep(presets[0]); state.preset = presets[0]; } catch (e) { $('err').textContent = e.message; return; }
  requestAnimationFrame(t => { state.last = t; tick(t); });
  presets.slice(1).forEach(n => prep(n).catch(() => {}));   // warm the rest in the background
}
start();
</script>
</body>
</html>
