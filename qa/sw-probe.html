<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Squall Cove service worker probe</title>
<!-- Test page for qa/sw-check.mjs. It lives under /squall-cove/ so the real sw.js (scope /squall-cove/) controls it. It is not part of the game. -->
</head><body><p>Service worker probe</p>
<script>
const O = location.origin + '/squall-cove/';
// stand in for an older release and for another app on the same origin
window.seedOld = async () => {
  await (await caches.open('squall-cove-v9.2.0')).put(O + 'assets/old_asset_test.bin', new Response('OLD ASSET'));
  await (await caches.open('squall-cove-v9.2.0')).put(O + 'index.html', new Response('old page'));
  await (await caches.open('hinterland-v3')).put('https://robertwalterj.github.io/hinterland/x', new Response('NOT MINE'));
  await (await caches.open('squall-cove-notes')).put(O + 'n', new Response('similar name, not mine'));
  localStorage.setItem('hinterland-save', 'keep me'); localStorage.setItem('squall-cove-prefs', '{"keep":1}');
  return true;
};
window.register = async (script) => { const r = await navigator.serviceWorker.register(script); await navigator.serviceWorker.ready; for (let i = 0; i < 60 && !(r.active && r.active.state === 'activated'); i++) await new Promise(x => setTimeout(x, 100)); return r.active ? r.active.scriptURL + ' ' + r.active.state : 'none'; };
window.update = async () => { const r = await navigator.serviceWorker.getRegistration(O); await r.update(); for (let i = 0; i < 80; i++) { await new Promise(x => setTimeout(x, 100)); const w = r.active; if (w && !r.installing && !r.waiting) { const ks = await caches.keys(); if (ks.some(k => k === window.__want)) break; } } return true; };
window.snap = async () => { const ks = (await caches.keys()).sort(), out = { keys: ks, assets: [], other: null, notes: null, ls: [localStorage.getItem('hinterland-save'), localStorage.getItem('squall-cove-prefs')] };
  if (ks.includes('squall-cove-assets-a1')) out.assets = (await (await caches.open('squall-cove-assets-a1')).keys()).map(r => new URL(r.url).pathname).sort();
  if (ks.includes('hinterland-v3')) out.other = await (await (await caches.open('hinterland-v3')).match('https://robertwalterj.github.io/hinterland/x')).text();
  if (ks.includes('squall-cove-notes')) out.notes = await (await (await caches.open('squall-cove-notes')).match(O + 'n')).text();
  if (ks.includes('squall-cove-assets-a1')) { const h = await (await caches.open('squall-cove-assets-a1')).match(O + 'assets/old_asset_test.bin'); out.moved = h ? await h.text() : null; }
  return out; };
window.controlled = () => !!navigator.serviceWorker.controller;
</script></body></html>
